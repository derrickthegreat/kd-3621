<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROK Player Performance Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: rgb(3, 7, 18); /* bg-gray-950 */
            color: white;
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* Navigation Bar */
        .nav {
            background: rgb(17, 24, 39); /* bg-gray-900 */
            border-bottom: 1px solid rgb(31, 41, 55); /* border-gray-800 */
            padding: 0.75rem 0;
            margin-bottom: 1.5rem;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: rgb(251, 146, 60); /* text-orange-400 */
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            color: white;
            background: rgba(59, 130, 246, 0.1); /* bg-blue-200/10 */
            border: 1px solid rgba(147, 197, 253, 0.2); /* border-blue-300/20 */
            border-radius: 0.5rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-back:hover {
            background: rgba(147, 197, 253, 0.2); /* hover:bg-blue-300/20 */
        }

        /* Header */
        .header {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .header-top {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .header h1 {
            font-size: 2.25rem;
            font-weight: bold;
            background: linear-gradient(to right, rgb(249, 115, 22), rgb(253, 186, 116)); /* from-orange-500 to-orange-300 */
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* DKP Formula Banner */
        .dkp-formula {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: rgb(17, 24, 39); /* bg-gray-900 */
            border: 1px solid rgb(31, 41, 55); /* border-gray-800 */
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .dkp-formula-content {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }

        .dkp-label {
            color: rgb(245, 158, 11); /* text-amber-500 */
            font-weight: 500;
        }

        .dkp-term {
            display: flex;
            align-items: center;
        }

        .dkp-stat {
            color: rgb(134, 239, 172); /* text-green-300 */
        }

        .dkp-multiplier {
            color: rgb(245, 158, 11); /* text-amber-500 */
            margin-left: 0.25rem;
        }

        .dkp-plus {
            color: rgb(74, 222, 128); /* text-green-400 */
            font-weight: bold;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .search-box {
            flex: 1;
            max-width: 24rem;
            padding: 0.5rem 1rem;
            background: rgb(31, 41, 55); /* bg-gray-800 */
            color: white;
            border: 1px solid rgb(55, 65, 81); /* border-gray-700 */
            border-radius: 0.375rem;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            border-color: rgb(249, 115, 22); /* focus:border-orange-500 */
        }

        .search-box::placeholder {
            color: rgb(156, 163, 175); /* placeholder-gray-400 */
        }

        .controls-right {
            display: flex;
            gap: 1rem;
        }

        .filter-select {
            padding: 0.5rem 1rem;
            background: rgb(31, 41, 55); /* bg-gray-800 */
            color: white;
            border: 1px solid rgb(55, 65, 81); /* border-gray-700 */
            border-radius: 0.375rem;
            font-size: 0.875rem;
            outline: none;
        }

        .btn {
            padding: 0.5rem 1rem;
            background: rgb(245, 158, 11); /* bg-amber-500 */
            color: white;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background: rgb(217, 119, 6); /* hover:bg-amber-600 */
        }

        /* Table */
        .table-container {
            border-radius: 0.75rem;
            overflow: hidden;
            background: rgba(59, 130, 246, 0.05); /* bg-blue-200/5 */
            border: 1px solid rgba(147, 197, 253, 0.1); /* border-blue-300/10 */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: white;
            font-size: 0.875rem;
        }

        thead {
            text-transform: uppercase;
            color: rgb(251, 146, 60); /* text-orange-400 */
            font-size: 0.75rem;
            background: rgba(59, 130, 246, 0.1); /* bg-blue-200/10 */
            border-bottom: 1px solid rgba(147, 197, 253, 0.1); /* border-blue-300/10 */
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 0.75rem;
            text-align: left;
            cursor: pointer;
            user-select: none;
            font-weight: 600;
        }

        th:hover {
            background: rgba(59, 130, 246, 0.15);
        }

        th .header-content {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid rgba(55, 65, 81, 0.3);
            transition: background-color 0.3s ease;
        }

        tr:hover td {
            background: rgba(31, 41, 55, 0.5);
        }

        .rank-cell {
            font-weight: bold;
            text-align: center;
            width: 60px;
        }

        .name-cell {
            font-weight: 600;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .alliance-cell {
            background: rgb(75, 85, 99); /* bg-gray-600 */
            border-radius: 0.25rem;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            text-align: center;
            max-width: 80px;
            display: inline-block;
        }

        /* Center the alliance cell content */
        td.alliance-cell {
            text-align: center;
        }

        .number-cell {
            text-align: right;
            font-family: 'Courier New', monospace;
        }

        .percentage-cell {
            text-align: right;
            font-weight: bold;
        }

        /* Performance indicators */
        .excellent-performer {
            background: rgba(34, 197, 94, 0.1); /* green-500 with opacity */
            border-left: 3px solid rgb(34, 197, 94);
            color: rgb(229, 231, 235); /* gray-200 */
        }

        .good-performer {
            background: rgba(59, 130, 246, 0.1); /* blue-500 with opacity */
            border-left: 3px solid rgb(59, 130, 246);
            color: rgb(229, 231, 235); /* gray-200 */
        }

        .average-performer {
            background: rgba(245, 158, 11, 0.1); /* amber-500 with opacity */
            border-left: 3px solid rgb(245, 158, 11);
            color: rgb(229, 231, 235); /* gray-200 */
        }

        .poor-performer {
            background: rgba(239, 68, 68, 0.1); /* red-500 with opacity */
            border-left: 3px solid rgb(239, 68, 68);
            color: rgb(156, 163, 175); /* gray-400 */
        }

        /* Pagination */
        .pagination {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: rgba(17, 24, 39, 0.5); /* bg-gray-900/50 */
            margin-top: 1.5rem;
            border: 1px solid rgb(31, 41, 55); /* border-gray-800 */
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }

        .pagination-info {
            color: rgb(156, 163, 175); /* text-gray-400 */
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .page-btn {
            padding: 0.5rem;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            border-radius: 0.25rem;
            transition: background-color 0.3s ease;
        }

        .page-btn:hover:not(:disabled) {
            background: rgb(31, 41, 55); /* hover:bg-gray-800 */
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-btn.active {
            background: rgb(249, 115, 22); /* bg-orange-500 */
        }

        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.1em;
            color: rgb(156, 163, 175); /* text-gray-400 */
        }

        /* Responsive design */
        @media (min-width: 640px) {
            .header-top {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            .controls {
                flex-direction: row;
                align-items: center;
            }

            .pagination {
                flex-direction: row;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0.5rem;
            }

            .header h1 {
                font-size: 1.875rem;
            }
            
            .dkp-formula-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.25rem;
            }
            
            table {
                font-size: 0.75rem;
            }
            
            th, td {
                padding: 0.5rem 0.25rem;
            }

            .search-box {
                max-width: 100%;
            }

            .controls-right {
                flex-direction: column;
                width: 100%;
            }

            .filter-select {
                width: 100%;
            }
        }
    </style>
</head>

                    <select id="performanceFilter" class="filter-select">

                        <option value="average">10-50% (Average)</option>
                        <option value="poor">0-10% (Poor)</option>
                    </select>
                    <button class="btn" onclick="copyNames()">Copy Names</button>
                    <button class="btn" onclick="exportToCSV()">Export Data</button>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table id="playerTable">
                <thead>
                    <tr>
                        <th onclick="sortTable('rank')" style="width: 60px;">
                            <div class="header-content">#</div>
                        </th>
                        <th onclick="sortTable('name')">
                            <div class="header-content">Governor</div>
                        </th>
                        <th onclick="sortTable('alliance')">
                            <div class="header-content">Alliance</div>
                        </th>
                        <th onclick="sortTable('dkpScore')">
                            <div class="header-content">Season DKP</div>
                        </th>
                        <th onclick="sortTable('dkpGoal')">
                            <div class="header-content">DKP Goal</div>
                        </th>
                        <th onclick="sortTable('reached')">
                            <div class="header-content">Reached %</div>
                        </th>
                        <th onclick="sortTable('basePower')">
                            <div class="header-content">Power</div>
                        </th>
                        <th onclick="sortTable('t4Kills')">
                            <div class="header-content">T4 Kills</div>
                        </th>
                        <th onclick="sortTable('t5Kills')">
                            <div class="header-content">T5 Kills</div>
                        </th>
                        <th onclick="sortTable('allDeads')">
                            <div class="header-content">Deaths</div>
                        </th>
                        <th onclick="sortTable('honorPoints')">
                            <div class="header-content">Honor Points</div>
                        </th>
                    </tr>
                </thead>
                <tbody id="playerTableBody">
                    <tr><td colspan="11" class="loading">Loading player data...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
            <span class="pagination-info">Showing <span id="showingFrom">0</span> to <span id="showingTo">0</span> of <span id="totalEntries">0</span> entries</span>
            <div class="pagination-controls">
                <button class="page-btn" id="prevBtn" onclick="changePage(currentPage - 1)">&lt;</button>
                <div id="pageNumbers"></div>
                <button class="page-btn" id="nextBtn" onclick="changePage(currentPage + 1)">&gt;</button>
            </div>
        </div>
    </div>

        function parsePlayerData(jsContent) {
            try {
                // Extract the array content using regex
                const arrayMatch = jsContent.match(/"playerData"\s*=\s*\[([\s\S]*)\]/);
                if (!arrayMatch) {
                    throw new Error('Could not find playerData array');
                }

                // Parse individual player objects
                const playerObjects = [];
                const objectPattern = /{\s*"Governor ID":[^}]+}/g;
                let match;
                
                while ((match = objectPattern.exec(arrayMatch[1])) !== null) {
                    try {
                        // Clean up the object string and convert to valid JSON
                        let objectStr = match[0];
                        objectStr = objectStr.replace(/(\w+):/g, '"$1":'); // Add quotes around keys
                        objectStr = objectStr.replace(/:\s*([^",\s\]]+)/g, ': "$1"'); // Add quotes around values
                        objectStr = objectStr.replace(/:\s*"(\d+)"/g, ': $1'); // Remove quotes from numbers
                        objectStr = objectStr.replace(/,\s*}/g, '}'); // Remove trailing commas
                        
                        const playerObj = JSON.parse(objectStr);
                        playerObjects.push(playerObj);
                    } catch (e) {
                        console.warn('Could not parse player object:', e);
                    }
                }

                if (playerObjects.length === 0) {
                    throw new Error('No player objects found');
                }

                playerData = playerObjects;
                processData();
            } catch (error) {
                console.error('Error parsing player data:', error);
                loadSampleData();
            }
        }

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toLocaleString();
        }

        function getPerformanceClass(reached) {
            if (reached >= 100) return 'excellent-performer';
            if (reached >= 50) return 'good-performer';
            if (reached >= 10) return 'average-performer';
            return 'poor-performer';
        }

        function renderTable() {
            const tbody = document.getElementById('playerTableBody');
            const start = (currentPage - 1) * playersPerPage;
            const end = start + playersPerPage;
            const pageData = filteredData.slice(start, end);

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" class="loading">No players found matching your criteria.</td></tr>';
                return;
            }

            tbody.innerHTML = pageData.map((player, index) => {
                const rank = start + index + 1;
                const reachedClass = getPerformanceClass(player.Reached);
                
                return `
                    <tr class="${reachedClass}">
                        <td class="rank-cell">#${rank}</td>
                        <td class="name-cell" title="${player.Name}">${player.Name}</td>
                        <td class="alliance-cell">${player.Alliance || 'N/A'}</td>

        function renderPagination() {
            const totalPages = Math.ceil(filteredData.length / playersPerPage);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let paginationHTML = '';
            
            // Previous button
            if (currentPage > 1) {
                paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage - 1})">← Previous</button>`;
            }
            
            // Page numbers
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);
            
            if (startPage > 1) {
                paginationHTML += `<button class="page-btn" onclick="changePage(1)">1</button>`;
                if (startPage > 2) {
                    paginationHTML += `<span>...</span>`;
                }
            }
            
            for (let i = startPage; i <= endPage; i++) {
                const activeClass = i === currentPage ? 'active' : '';
                paginationHTML += `<button class="page-btn ${activeClass}" onclick="changePage(${i})">${i}</button>`;
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationHTML += `<span>...</span>`;
                }
                paginationHTML += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
            }
            
            // Next button
            if (currentPage < totalPages) {
                paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage + 1})">Next →</button>`;
            }
            
            pagination.innerHTML = paginationHTML;
        }

        function changePage(page) {
            currentPage = page;
            renderTable();

        function sortTable(column) {
            const direction = (currentSort.column === column && currentSort.direction === 'desc') ? 'asc' : 'desc';
            currentSort = { column, direction };
            
            filteredData.sort((a, b) => {
                let aVal = a[column] || a[getColumnKey(column)] || 0;
                let bVal = b[column] || b[getColumnKey(column)] || 0;
                
                if (typeof aVal === 'string') {
                    aVal = aVal.toLowerCase();
                    bVal = bVal.toLowerCase();
                }
                
                if (direction === 'asc') {
                    return aVal > bVal ? 1 : -1;
                } else {
                    return aVal < bVal ? 1 : -1;
                }
            });
            
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        function getColumnKey(column) {
            const keyMap = {
                'dkpScore': 'DKP Score',
                'dkpGoal': 'DKP Goal',
                'basePower': 'Base Power',
                't4Kills': 'T4 Kills',
                't5Kills': 'T5 Kills',
                'allDeads': 'All Deads',
                'honorPoints': 'Honor Points',
                'name': 'Name',
                'alliance': 'Alliance',
                'reached': 'Reached'
            };
            return keyMap[column] || column;
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const allianceFilter = document.getElementById('allianceFilter').value;
            const performanceFilter = document.getElementById('performanceFilter').value;
            
            filteredData = playerData.filter(player => {
                // Search filter
                const matchesSearch = !searchTerm || 
                    player.Name.toLowerCase().includes(searchTerm) ||
                    (player.Alliance && player.Alliance.toLowerCase().includes(searchTerm));
                
                // Alliance filter
                const matchesAlliance = !allianceFilter || player.Alliance === allianceFilter;
                
                // Performance filter
                let matchesPerformance = true;
                if (performanceFilter) {
                    const reached = player.Reached;
                    switch (performanceFilter) {
                        case 'excellent':
                            matchesPerformance = reached >= 100;
                            break;
                        case 'good':
                            matchesPerformance = reached >= 50 && reached < 100;
                            break;
                        case 'average':
                            matchesPerformance = reached >= 10 && reached < 50;
                            break;
                        case 'poor':
                            matchesPerformance = reached >= 0 && reached < 10;
                            break;
                    }
                }
                
                return matchesSearch && matchesAlliance && matchesPerformance;
            });
            
            currentPage = 1;
            renderTable();
            renderPagination();
        }

            const headers = ['Rank', 'Name', 'Alliance', 'DKP Score', 'DKP Goal', 'Reached %', 'Base Power', 'T4 Kills', 'T5 Kills', 'All Deads', 'Honor Points'];
            
            const csvContent = [

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'rok_player_performance.csv';
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function copyNames() {
            // Create list with ID and Name format
            const idNameList = filteredData.map(player => 
                `${player["Governor ID"]} - ${player.Name}`
            );
            const copyText = idNameList.join('\n');
            
            // Copy to clipboard
            navigator.clipboard.writeText(copyText).then(() => {
                showCopyFeedback(idNameList.length, true);
            }).catch(err => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = copyText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                showCopyFeedback(idNameList.length, true);
            });
        }

        function showCopyFeedback(count, success) {
            // Create or get feedback element
            let feedback = document.getElementById('copyFeedback');
            if (!feedback) {
                feedback = document.createElement('div');
                feedback.id = 'copyFeedback';
                feedback.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    padding: 12px 20px;
                    border-radius: 8px;
                    color: white;
                    font-weight: bold;
                    z-index: 1000;
                    transition: all 0.3s ease;
                    transform: translateX(100%);
                `;
                document.body.appendChild(feedback);
            }

            if (success) {
                feedback.textContent = `✓ Copied ${count} player IDs and names!`;
                feedback.style.background = 'rgb(34, 197, 94)'; // green-500
            } else {
                feedback.textContent = `✗ Failed to copy names`;
                feedback.style.background = 'rgb(239, 68, 68)'; // red-500
            }

            // Show feedback
            feedback.style.transform = 'translateX(0)';
            
            // Hide after 3 seconds
            setTimeout(() => {
                feedback.style.transform = 'translateX(100%)';
            }, 3000);
        }
